name: Deploy to GitHub Pages

# Publishes frontend/dist to Pages on every push to main. The validation suite runs
# first and a failure stops the deploy, so a broken validator cannot reach students.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Validation suite
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        # Advisory for now: the repo has pre-existing lint errors. Drop this line to
        # make lint blocking once they are cleared.
        run: npm run lint || true

      # Also copies backend/data into public/ via the prebuild hook.
      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
